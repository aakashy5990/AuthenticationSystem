
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: auth-backend
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      PORT: 4000
      NODE_ENV: development

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: auth-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    depends_on:
      - server
